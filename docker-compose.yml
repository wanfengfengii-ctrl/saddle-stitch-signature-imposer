# 长驻 API 服务。
# 宿主端口可通过环境变量 API_PORT 覆盖（默认 8000）：
#   API_PORT=9000 docker compose up --build api
services:
  api:
    # 镜像只在此服务构建一次，verify 按镜像名复用，避免两个服务并行
    # 构建同一镜像标签（saddle-stitch-api:latest）造成打标签冲突。
    build: .
    image: saddle-stitch-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3); sys.exit(0 if json.load(r)['status']=='ok' else 1)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # 一次性验收服务：等待 API 健康后执行端到端验收，打印结果并退出
  # （退出码 0 即验收通过；restart: no 保证不常驻、不重试）。
  # 复用 api 构建出的本地镜像（pull_policy: never，绝不尝试远程拉取）。
  # 用法：
  #   docker compose up --build verify
  #   docker compose build api && docker compose run --rm verify
  verify:
    image: saddle-stitch-api:latest
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://api:8000"
    command: ["python", "scripts/verify.py"]
    restart: "no"
